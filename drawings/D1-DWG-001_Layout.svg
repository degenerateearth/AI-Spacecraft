/><text x="620" y="232.0" class="small">51 to +54 Z</text><text x="181" y="697" class="label">100 nominal rail-to-rail</text><text x="55" y="440" transform="rotate(-90 55 440)" class="label">113.5 nominal rail length</text><text x="865" y="155" class="sub">CAMERA BAY PLAN / +Z VIEW</text><rect x="880" y="235" width="360" height="360" fill="white" stroke="#192b42" stroke-width="3"/><rect x="1040" y="321" width="180" height="168" fill="#f6cc8b" stroke="#44566a"/><circle cx="1230" cy="405" r="19" fill="#192b42"/><path d="M1250,405 H1320 M1320,405 l-14,-8 M1320,405 l-14,8" stroke="#192b42" fill="none" stroke-width="2"/><text x="1070" y="390" class="label">CS-101</text><text x="1060" y="420" class="small">optical orientation</text><text x="1060" y="443" class="small">requires vendor CAD</text><text x="1248" y="450" class="small">+X</text><text x="880" y="632" class="label">Aperture panel: ≥1.8 W BOL target</text><rect x="55" y="745" width="1290" height="195" rx="8" fill="#e7edf4"/><text x="78" y="779" class="sub">ENGINEERING NOTES</text><text x="78" y="812" class="label">1. Five intact solar faces ≥2.3 W; camera face ≥1.8 W. No cell cutting without supplier design.</text><text x="78" y="843" class="label">2. Connector envelopes, rails, switch travel, standoffs, baffle and fasteners require released vendor CAD.</text><text x="78" y="874" class="label">3. Camera points along +X in an uncontrolled attitude; no target pointing or nadir orientation is guaranteed.</text><text x="78" y="905" class="label">4. Mass: 1.064 kg estimate / 1.276 kg with growth. Spacecraft envelope compliance remains OPEN.</text></svg>
